
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        const filterViteMsg = function(fn) {
          return function(...args) {
            if (args.length > 0) {
              const msg = args[0];
              const text = typeof msg === 'string' ? msg : (msg && msg.message ? msg.message : '');
              if (typeof text === 'string' && (text.includes('[vite]') || text.includes('WebSocket') || text.includes('websocket'))) {
                return;
              }
            }
            return fn.apply(console, args);
          };
        };
        console.error = filterViteMsg(console.error);
        console.warn = filterViteMsg(console.warn);
      })();
    </script>
    <link rel="icon" type="image/png" href="/app-logo.png" />
    
    <!-- PWA Optimized Viewport: Prevents user scaling, enables cover fit -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10B981" />
    <meta name="theme-color" content="#10B981" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#064e3b" media="(prefers-color-scheme: dark)" />
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="المحاسب الزراعي">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512x512.png">
    <!-- End PWA Meta Tags -->
    
    <title>المحاسب الزراعي</title>

    <!-- Cairo Font Preconnect & display=swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- CRITICAL: Global Polyfill to prevent "process is not defined" error -->
    <script>
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      window.process.env.NODE_ENV = window.process.env.NODE_ENV || 'production';
    </script>

    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-800 dark:text-neutral-200 select-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.update().then(() => {
              console.log('Service Worker forcefully updated.');
            });
          }
        });
      });
    }
  </script>
</body>
</html>
