      - name: Reconstruct Android Project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          rm -rf android
          npx cap add android
          
          cat << EOF > android/app/google-services.json
          $GOOGLE_SERVICES_JSON
          EOF
          
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.1"' android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          
          echo "configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } }" >> android/app/build.gradle
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          
          # رقم الإصدار الموحد للتطبيق
          sed -i -E "s/versionCode [0-9]+/versionCode 6/g" android/app/build.gradle
          sed -i -E "s/versionName \"[0-9.]+\"/versionName \"1.6\"/g" android/app/build.gradle
          
          npx cap sync android
          # توليد الأيقونات آلياً باستخدام اللوجو الخاص بك
          npx capacitor-assets generate --android

          # ------------- أوامر إصلاح أيقونة ولون الإشعارات -------------
          # 1. نسخ اللوجو الشفاف المفرغ من ملفات الموقع إلى مجلدات الأندرويد
          mkdir -p android/app/src/main/res/drawable
          cp dist/badge-icon.png android/app/src/main/res/drawable/ic_notification.png

          # 2. إنشاء ملف تعريف للون الأخضر الخاص ببراند المحاسب الزراعي
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/colors_notification.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="notification_color">#10B981</color>
          </resources>
          EOF

          # 3. إجبار نظام أندرويد (عبر الـ Manifest) على استخدام اللوجو الشفاف واللون الأخضر دائماً
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notification_color" />' android/app/src/main/AndroidManifest.xml
          # -------------------------------------------------------------
          
