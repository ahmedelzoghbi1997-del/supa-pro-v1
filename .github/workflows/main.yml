name: Build Unified App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure App Identity
        run: |
          sed -i -E "s/appId: *['\"].*['\"]/appId: 'com.ahmed.supapro'/g" capacitor.config.ts
          sed -i -E "s/appName: *['\"].*['\"]/appName: 'المحاسب الزراعي'/g" capacitor.config.ts

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/push-notifications @capacitor/assets

      - name: Build Web App
        run: npm run build

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp -r dist/* www/

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Reconstruct Android Project
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VERSION_CODE: ${{ vars.VERSION_CODE || secrets.VERSION_CODE || '6' }}
          VERSION_NAME: ${{ vars.VERSION_NAME || secrets.VERSION_NAME || '1.6' }}
        run: |
          rm -rf android
          npx cap add android
          
          cat << EOF > android/app/google-services.json
          $GOOGLE_SERVICES_JSON
          EOF
          
          # إضافة Google Services باستخدام Plugins DSL المتوافقة مع Gradle الحديث
          if grep -q "plugins {" android/build.gradle; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services" version "4.4.2" apply false' android/build.gradle
          else
            sed -i '1s/^/plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false\n}\n/' android/build.gradle
          fi

          if grep -q "plugins {" android/app/build.gradle; then
            sed -i '/plugins {/a \    id "com.google.gms.google-services"' android/app/build.gradle
          else
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          
          echo "configurations.all { resolutionStrategy.eachDependency { if (requested.group == 'org.jetbrains.kotlin') { useVersion '1.8.22' } } }" >> android/app/build.gradle
          sed -i '/<uses-permission android:name="android.permission.INTERNET"/a \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          
          # قراءة رقم وإصدار التطبيق من المتغيرات أو Secrets
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/g" android/app/build.gradle
          sed -i -E "s/versionName \"[0-9.]+\"/versionName \"${VERSION_NAME}\"/g" android/app/build.gradle
          
          npx cap sync android
          # توليد الأيقونات آلياً مباشرة من assets/icon.png
          npx @capacitor/assets generate --android --assetPath assets

          # ------------- أوامر إصلاح أيقونة ولون الإشعارات -------------
          # 1. نسخ اللوجو الشفاف المفرغ من ملفات الموقع إلى مجلدات الأندرويد
          mkdir -p android/app/src/main/res/drawable
          cp dist/badge-icon.png android/app/src/main/res/drawable/ic_notification.png

          # 2. إنشاء ملف تعريف للون الأخضر الخاص ببراند المحاسب الزراعي
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/colors_notification.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="notification_color">#10B981</color>
          </resources>
          EOF

          # 3. إجبار نظام أندرويد (عبر الـ Manifest) على استخدام اللوجو الشفاف واللون الأخضر دائماً
          sed -i '/<\/application>/i \        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_notification" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notification_color" />' android/app/src/main/AndroidManifest.xml
          # -------------------------------------------------------------

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        run: mv ${{steps.sign_app.outputs.signedReleaseFile}} android/app/build/outputs/apk/release/AlMohasibAlZirai.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMohasibAlZirai.apk
          path: android/app/build/outputs/apk/release/AlMohasibAlZirai.apk
          
